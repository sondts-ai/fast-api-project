services:
  # Dịch vụ Database
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dịch vụ FastAPI
  backend:
    build: .
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:123456@db:5432/postgres
      - A_DATABASE_URL=postgresql+asyncpg://postgres:123456@db:5432/postgres
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-keepitreal/vietnamese-sbert}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./app:/app

  # Dịch vụ Ollama (Chạy Ollama chung trong Docker)
  ollama:
    image: ollama/ollama
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Dịch vụ tự động tải Model
  ollama-pull:
    image: ollama/ollama
    container_name: ollama_pull_model
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull "$${OLLAMA_MODEL}"
    restart: "no"

volumes:
  postgres_data:
  ollama_data: